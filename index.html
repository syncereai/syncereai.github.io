<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Syncere</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background-color: #ffffff;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .page {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 2rem 3rem;
            width: 100%;
            max-width: 1100px;
            padding: 2rem clamp(1.25rem, 5vw, 3rem);
            box-sizing: border-box;
        }

        .logo {
            display: block;
            max-width: min(63vw, 504px);
            width: auto;
            height: auto;
            flex-shrink: 0;
        }

        .copy {
            flex: 1 1 240px;
            max-width: 22rem;
            margin-left: auto;
            text-align: right;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: clamp(1rem, 2.5vw, 1.125rem);
            line-height: 1.55;
            color: #111;
        }

        .copy p {
            margin: 0;
        }

        .copy p + p {
            margin-top: 0.65em;
        }

        .copy a {
            color: #111;
            text-decoration: underline;
            text-underline-offset: 0.15em;
        }

        .copy a:hover {
            opacity: 0.75;
        }

        @media (max-width: 700px) {
            .page {
                flex-direction: column;
                align-items: center;
                justify-content: center;
                row-gap: 3.5rem;
            }

            .copy {
                margin-left: 0;
                text-align: center;
                max-width: none;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <img
            class="logo"
            src="Files/Syncere_Logotype_Main.png"
            alt="Syncere"
        />
        <div class="copy">
            <p>Launching Soon.</p>
            <p>Designed in Palo Alto.</p>
            <p>Follow <a href="https://x.com/bySyncere">@bySyncere</a></p>
        </div>
    </div>
</body>
</html>
