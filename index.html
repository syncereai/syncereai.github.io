<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Syncere</title>
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background-color: #ffffff;
        }

        body {
            min-height: 100vh;
        }

        .shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            align-content: center;
            column-gap: clamp(1.5rem, 4vw, 3rem);
            row-gap: 2rem;
            width: 100%;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
            padding: 2rem clamp(1.25rem, 5vw, 3rem);
            box-sizing: border-box;
        }

        .logo-wrap {
            justify-self: start;
        }

        .logo {
            display: block;
            max-width: min(100%, 504px);
            width: auto;
            height: auto;
        }

        .logo--dark {
            display: none;
        }

        .copy {
            justify-self: end;
            align-self: center;
            max-width: 22rem;
            width: max-content;
            min-width: 0;
            text-align: right;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: clamp(1rem, 2.5vw, 1.125rem);
            line-height: 1.55;
            color: #111;
        }

        .copy p {
            margin: 0;
        }

        .copy p + p {
            margin-top: 0.65em;
        }

        .copy a {
            color: #111;
            text-decoration: underline;
            text-underline-offset: 0.15em;
        }

        .copy a:hover {
            opacity: 0.75;
        }

        @media (min-width: 701px) {
            .page {
                padding-left: clamp(0.5rem, 1.5vw, 1.25rem);
                padding-right: clamp(1.25rem, 5vw, 3rem);
            }

            .logo-wrap {
                transform: translateX(-2.5rem);
            }
        }

        @media (max-width: 700px) {
            .page {
                grid-template-columns: 1fr;
                justify-items: center;
                row-gap: clamp(2.5rem, 8vw, 4rem);
                padding-left: 2rem;
                padding-right: 2rem;
            }

            .logo-wrap {
                justify-self: center;
                transform: none;
            }

            .copy {
                justify-self: center;
                width: 100%;
                max-width: none;
                text-align: center;
            }

            .logo {
                max-width: min(63vw, 504px);
            }
        }

        .site-footer {
            flex-shrink: 0;
            text-align: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 0.75rem;
            line-height: 1.4;
            color: #666;
            padding: 0 1rem 1.25rem;
        }

        @media (prefers-color-scheme: dark) {
            html,
            body {
                background-color: #0a0a0a;
            }

            .logo--light {
                display: none;
            }

            .logo--dark {
                display: block;
            }

            .copy {
                color: #e8e8e8;
            }

            .copy a {
                color: #e8e8e8;
            }

            .site-footer {
                color: #8a8a8a;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="page">
            <div class="logo-wrap">
                <img
                    class="logo logo--light"
                    src="Files/Syncere_Logotype_Main.png"
                    alt="Syncere"
                />
                <img
                    class="logo logo--dark"
                    src="Files/Syncere_Logotype_Main%20-%20White.png"
                    alt="Syncere"
                />
            </div>
            <div class="copy">
                <p>Launching Soon.</p>
                <p>Follow <a href="https://x.com/bySyncere">@bySyncere</a></p>
            </div>
        </div>
        <footer class="site-footer">Designed in Palo Alto, CA</footer>
    </div>
</body>
</html>
